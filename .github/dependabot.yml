# Aggiornamenti di sicurezza automatici: una PR quando una dipendenza ha una vulnerabilità nota
# o una nuova versione (raggruppate per non intasare). La CI le verifica come le altre PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dipendenze:
        update-types: [minor, patch]
    ignore:
      # I tipi di Node seguono la versione usata in produzione e in CI (22, vedi "engines").
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /functions/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
