name: Pulizia database

# Elenca (report) o elimina (apply) tabelle, colonne, indici e bucket di Appwrite che non sono
# più nello schema di setup-db.js. Lo stesso passaggio gira da solo a ogni "Deploy Appwrite".
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = solo elenco, apply = elimina'
        required: true
        default: report
        type: choice
        options: [report, apply]
      buckets:
        description: 'force = elimina anche i bucket fuori schema che contengono file'
        required: false
        default: keep
        type: choice
        options: [keep, force]

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Residui fuori schema
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          PRUNE: ${{ inputs.mode }}
          PRUNE_BUCKETS: ${{ inputs.buckets }}
        run: node setup-db.js --prune-only
