name: Schermate

# Genera le schermate dell'app (con dati di esempio) per la revisione visiva
# e le pubblica sul branch ci-screenshots/<branch della PR>.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.48.2 axe-core@4.10.2
          npx playwright install --with-deps chromium

      - name: Build
        run: npx vite build
        env:
          VITE_APPWRITE_ENDPOINT: https://cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: demo

      - name: Schermate
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          mkdir -p screenshots
          node scripts/screenshots/capture.mjs http://localhost:4173 screenshots | tee screenshots/log.txt

      # Qualità: percorsi principali end-to-end, prestazioni della landing e budget del bundle.
      # I risultati finiscono accanto alle schermate (e2e.md, perf.md); l'esito si controlla alla fine.
      - name: Test end-to-end e prestazioni
        run: |
          set +eo pipefail
          node scripts/e2e/flows.mjs http://localhost:4173 screenshots/e2e 2>&1 | tee screenshots/e2e.txt; echo "${PIPESTATUS[0]}" > screenshots/e2e.status
          cp screenshots/e2e/e2e.md screenshots/e2e.md 2>/dev/null || true
          node scripts/quality/bundle-budget.mjs dist screenshots/perf.md 2>&1 | tee screenshots/budget.txt; echo "${PIPESTATUS[0]}" > screenshots/budget.status

      - name: Pubblica sul branch ci-screenshots
        run: |
          BRANCH="ci-screenshots/${{ github.head_ref || github.ref_name }}"
          cd screenshots
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$BRANCH"
          git add -A
          git commit -q -m "Schermate di ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"

      - name: Controllo qualità
        run: |
          fail=0
          if [ "$(cat screenshots/e2e.status)" != "0" ]; then echo "::error::Test end-to-end non riusciti (vedi e2e.md sul branch ci-screenshots)."; grep -E "^✗" screenshots/e2e.txt; fail=1; fi
          if [ "$(cat screenshots/budget.status)" != "0" ]; then echo "::error::Bundle oltre il budget (vedi perf.md)."; grep -E "^✗" screenshots/budget.txt; fail=1; fi
          if grep -q "^♿" screenshots/log.txt; then echo "::error::Problemi di accessibilità gravi o critici (vedi a11y.md sul branch ci-screenshots)."; grep -E "^♿" screenshots/log.txt; fail=1; fi
          exit $fail

      # Prova di fumo: ogni pagina e ogni interazione devono riuscire senza errori JavaScript.
      # Le schermate vengono pubblicate comunque (passo precedente), così si vede cosa non va.
      - name: Controllo errori
        if: always()
        run: |
          if grep -q "^✗" screenshots/log.txt || grep -q "Errori JavaScript rilevati" screenshots/log.txt || grep -q "^↔" screenshots/log.txt; then
            echo "::error::Schermate non riuscite, errori JavaScript o pagine che escono dallo schermo (vedi log.txt e layout.md sul branch ci-screenshots)."
            grep -E "^✗|^ - |^↔|^    " screenshots/log.txt | head -60
            exit 1
          fi
