name: Aggiorna tutto (temporaneo)
on:
  push:
    branches: [chore/tutto-aggiornato]
    paths: [.github/workflows/tmp-ncu.yml]
permissions:
  contents: write
jobs:
  tailwind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Migrazione ufficiale a Tailwind 4
        run: |
          npm install --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash -u || true
          npx --yes @tailwindcss/upgrade@latest --force 2>&1 | tee upgrade.log || true
          echo "::notice title=upgrade::$(tail -c 3000 upgrade.log | tr '\n' ' ')"
          rm -f upgrade.log
          git add -A
          git commit -m "chore: migrazione automatica a Tailwind 4 (@tailwindcss/upgrade)" || true
          git push origin HEAD:chore/tutto-aggiornato
