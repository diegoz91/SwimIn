name: Aggiorna tutto (temporaneo)
on:
  push:
    branches: [chore/tutto-aggiornato]
    paths: [.github/workflows/tmp-ncu.yml]
permissions:
  contents: write
jobs:
  ncu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          npx --yes npm-check-updates@latest -u --target latest --filter tw-animate-css,@tailwindcss/vite,react-router
          npx --yes npm-check-updates@latest -u --target minor --filter @types/node
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json && git commit -m "chore: ultime versioni dei pacchetti nuovi" || true
          git push origin HEAD:chore/tutto-aggiornato
