name: Diagnosi iPad (temporaneo)
on:
  push:
    branches: [fix/tablet-browser-compat]
    paths: [.github/workflows/tmp-ipad.yml, scripts/e2e/ipad.mjs]
permissions:
  contents: write
jobs:
  ipad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: |
          npm ci
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps webkit
          npx vite build
        env:
          VITE_APPWRITE_ENDPOINT: https://cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: demo
      - run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          node scripts/e2e/ipad.mjs http://localhost:4173 ipad || echo "::warning::problemi iPad"
          cd ipad && git init -q && git config user.name bot && git config user.email bot@x && git checkout -q -b ci-screenshots/ipad && git add -A && git commit -qm ipad && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots/ipad
