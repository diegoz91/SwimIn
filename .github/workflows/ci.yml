name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Sulle PR lavoriamo sul branch vero (non sul merge commit) per poter
          # ricommittare il package-lock.json se serve.
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Se package.json è stato modificato senza aggiornare il lockfile,
      # lo rigeneriamo e lo committiamo sul branch della PR.
      - name: Sincronizza package-lock.json
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm install --package-lock-only --no-audit --no-fund
          if ! git diff --quiet package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: aggiorna package-lock.json"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Installa dipendenze
        run: npm ci

      # Vulnerabilità note nelle dipendenze usate dall'app (gravità alta o critica): segnalate qui e
      # corrette dalle PR di Dependabot. Non blocca la CI, per non fermare il lavoro su un avviso di terzi.
      - name: Controllo vulnerabilità delle dipendenze
        continue-on-error: true
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning title=Dipendenze vulnerabili::npm audit segnala vulnerabilità alte o critiche: controlla le PR di Dependabot."
            exit 1
          fi

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test frontend
        run: npx vitest run

      - name: Build
        run: npx vite build
        env:
          # Valori fittizi: la build non contatta Appwrite.
          VITE_APPWRITE_ENDPOINT: https://cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: ci-placeholder

      - name: Test delle funzioni Vercel (anteprime social, sitemap)
        run: node --test scripts/vercel/api.test.mjs

      - name: Test del lettore ISTAT (anagrafica comuni)
        run: node --test scripts/anagrafica/istat.test.mjs

      - name: Controllo sintassi script Appwrite
        run: |
          node --check setup-db.js
          node --check reset-db.js
          node --check scripts/check-sdk.js

      - name: Test Function "api"
        working-directory: functions/api
        run: |
          npm install --no-audit --no-fund
          npm test
