name: Monitor

# Ogni 10 minuti: il sito risponde, Appwrite e la Function rispondono, nessun picco di errori del
# server (scripts/ops/monitor.mjs). Se qualcosa non va il job fallisce e GitHub manda un'email
# (Settings → Notifications → Actions: "Send notifications for failed workflows only").
# Soglia degli errori modificabile con la variabile MONITOR_ERROR_THRESHOLD (predefinita 20).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ops
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Controlli
        env:
          APP_URL: ${{ vars.APP_URL }}
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          MONITOR_ERROR_THRESHOLD: ${{ vars.MONITOR_ERROR_THRESHOLD }}
        run: node scripts/ops/monitor.mjs
