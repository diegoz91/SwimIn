name: Prova reale

# Percorsi principali su Appwrite REALE con account veri e temporanei (scripts/real/flows.mjs):
# iscrizione, CV, candidatura, colloquio, assunzione, staff, turni, cambio turno, chat con allegato,
# più i controlli di sicurezza (chi non c'entra non legge né scrive). Gli account vengono eliminati.
# Parte dopo ogni deploy della Function riuscito, ogni notte e a mano (Actions → Prova reale → Run).
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Appwrite]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: real-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  real:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Controllo configurazione
        id: cfg
        env:
          ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
        run: |
          if [ -z "$ENDPOINT" ]; then
            echo "::warning::Secret APPWRITE_* non impostati: prova reale saltata."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.cfg.outputs.skip != 'true'

      - uses: actions/setup-node@v7
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Percorsi su Appwrite reale
        if: steps.cfg.outputs.skip != 'true'
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: node scripts/real/flows.mjs

      - name: Rapporto
        if: always() && steps.cfg.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prova-reale
          path: real-e2e.md
          if-no-files-found: ignore
