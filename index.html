<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SwimIn - Il network dei professionisti del nuoto</title>
    <meta name="description" content="SwimIn è il network professionale del nuoto: istruttori, assistenti bagnanti, allenatori e piscine si collegano, condividono esperienze e trovano lavoro." />
    <meta name="theme-color" content="#0E6A97" />
    <!-- Tema scuro prima del primo disegno (niente lampo bianco). La logica completa è in src/utils/theme.ts. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('swimin-theme');
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#08131A');
          }
        } catch (e) {
          /* localStorage non disponibile: resta il tema chiaro */
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SwimIn" />

    <!-- Anteprima nei social e nelle app di messaggistica -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SwimIn" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="SwimIn - Il network dei professionisti del nuoto" />
    <meta property="og:description" content="Istruttori, assistenti bagnanti, allenatori e piscine in un'unica rete: profilo professionale, brevetti, offerte di lavoro e sostituzioni urgenti." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-piastrella">
    <noscript>Per usare SwimIn devi attivare JavaScript nel browser.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
