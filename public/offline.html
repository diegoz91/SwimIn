<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0E6A97" />
<title>Senza connessione · SwimIn</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F2F8FA; color: #0A2738;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 26px; margin: 18px 0 6px; }
  p { color: #475569; margin: 0 0 22px; }
  .rope { height: 4px; border-radius: 2px; margin: 0 auto 22px; width: 160px;
          background: repeating-linear-gradient(90deg, #E23D3D 0 12px, #fff 12px 18px, #0E6A97 18px 30px, #fff 30px 36px); }
  button { font: inherit; font-weight: 700; color: #fff; background: #0E6A97; border: 0; border-radius: 999px; padding: 12px 24px; cursor: pointer; }
  button:focus-visible { outline: 4px solid #ABD8EC; }
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" alt="" />
  <h1>Sei senza connessione</h1>
  <div class="rope"></div>
  <p>SwimIn ha bisogno di internet per caricare feed, messaggi e annunci. Appena torni online riprendi da qui.</p>
  <button type="button" onclick="location.reload()">Riprova</button>
</main>
<script>addEventListener('online', () => location.reload());</script>
</body>
</html>
